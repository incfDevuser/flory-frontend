      <main>
        <h1>Flory: tu planta te dice lo que necesita</h1>
        <p>
          Flory es una app de cuidado de plantas hecha en Chile, pensada para Chile y Latinoamérica.
          Identifica tu planta con una foto, te dice cuándo regarla y diagnostica sus problemas.
          Está disponible gratis en el App Store:
          <a href="https://apps.apple.com/cl/app/flory/id6806155883">descargar Flory para iPhone</a>.
        </p>
        <h2>Qué hace Flory por tus plantas</h2>
        <ul>
          <li>Identifica la especie de tu planta con una foto, o la buscas en el catálogo de 206 especies chilenas.</li>
          <li>Calcula cuándo regar según la especie y el entorno real de tu planta, no una regla genérica.</li>
          <li>Resume el estado de tu planta en tres niveles (bien, atención, urgente) y te lo cuenta en primera persona.</li>
          <li>Diagnostica plagas y problemas a partir de una foto de una hoja: causa probable, qué hacer y en qué plazo.</li>
          <li>Te deja chatear con cada planta, que responde considerando su especie, su estado y sus diagnósticos recientes.</li>
          <li>Ajusta el ritmo de riego según cómo encontraste la tierra, explicándote por qué lo cambió.</li>
          <li>Incluye datos de toxicidad para mascotas en su catálogo de especies.</li>
        </ul>
        <h2>Preguntas frecuentes</h2>
        <h3>¿Flory es gratis?</h3>
        <p>Sí. El plan Free te deja cuidar una planta con su calendario de riego, identificación por foto, chat y diagnósticos, sin pagar nada.</p>
        <h3>¿Necesito el sensor para usar la app?</h3>
        <p>No. Hoy Flory funciona solo con la app. El sensor de humedad de suelo es un complemento opcional que llega más adelante.</p>
        <h3>¿Funciona con cualquier planta?</h3>
        <p>Tenemos un catálogo de 206 especies chilenas con sus cuidados. Si tu planta no está, Flory igual la cuida con cuidados aproximados y te lo indica claramente.</p>
        <p>
          Flory es operado por Tame SpA, Santiago de Chile. Contacto: contact@tame.cl ·
          <a href="https://www.instagram.com/somosflory/">Instagram @somosflory</a>
        </p>
